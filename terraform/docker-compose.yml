services:
  localstack:
    image: localstack/localstack
    container_name: localstack
    ports:
      - "4566:4566"

    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
      DEBUG: ${DEBUG}
      PERSISTENCE: ${PERSISTENCE}

    volumes:
      - ./localstack/data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  maritime_tracking:
    driver: bridge
